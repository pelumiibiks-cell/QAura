[project]
name = "qaura"
dynamic = ["version"]
description = "Autonomous QA agent: exploratory web testing + trained-model testing"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "pelumiibiks-cell", email = "pelumiibiks@gmail.com" },
]
keywords = ["qa", "testing", "web-testing", "playwright", "llm-agent", "ml-testing", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=2.0,<3",
    "jinja2>=3.1",
    "axe-playwright-python>=0.1.4",
    "Pillow>=10.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "scipy>=1.13",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24,<1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/pelumiibiks-cell/qaura"
Repository = "https://github.com/pelumiibiks-cell/qaura"

[project.scripts]
qaura = "qaura.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "qaura/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qaura"]

[tool.hatch.build.targets.sdist]
# hatchling's sdist default is "everything not VCS-ignored" — without an explicit
# include list that sweeps in runs*/ output and the ~95KB internal build log
# (docs/PROGRESS.md) alongside the actual package.
include = [
    "/qaura",
    "/tests",
    "/README.md",
    "/COMMANDS.md",
    "/HOW_IT_WORKS.md",
    "/AUTHENTICATED_TESTING.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/qaura.example.yaml",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
